services:
  - type: web
    name: richman-cab-hire
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Richman Cab & Hire
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: BOOKING_NOTIFY_EMAIL
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: RICHMAN_PHONE
        sync: false
      - key: RICHMAN_EMAIL
        sync: false
